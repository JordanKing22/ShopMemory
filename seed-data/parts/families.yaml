# Generator templates for the 44 non-anchor customer parts. For each customer: how many parts of each family to
# generate (and `quotes`: the customer's total quote count, anchors included), candidate descriptions, materials, feature sets, complexity and machines. {n} in part_number_format is
# n random digits. The generator never creates the reserved demo combination (see quotes/quote-model.yaml).
- customer: CUS-01   # Aerovance: 9 generated (+5 anchors = 14)
  part_number_format: "AV-{4}-{2}"
  quotes: 32
  families:
