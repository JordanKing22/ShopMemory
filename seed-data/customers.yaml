  is_new_customer: false
  part_classification_floor: customer_confidential
  classification: customer_confidential
  quality_requirements: >-
    AS9102 first article on new parts and revisions. Certs and material traceability with every lot.
  aliases: []
  part_number_pattern: '^AV-\d{4}-\d{2}$'
