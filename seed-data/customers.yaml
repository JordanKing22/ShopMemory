# The 6 fictional customers. part_classification_floor is the minimum classification of their parts, quotes and
# jobs (defense customers: export_controlled). The customer record itself is customer_confidential.
# `account` is role-hidden (owner/quoter only) and never sent to any model. Contact emails are always @example.com.
# part_number_pattern is a regular expression the loader checks every part number against.
