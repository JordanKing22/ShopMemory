  events:
    - { id: ME-001, on: "2026-04-13", kind: issue, job: J-I02, person: PER-06,
        summary: "Chips packed in the jaw pocket while cutting the soft jaw set with the vise at the left end; flood nozzles re-aimed by hand and the pocket re-cut." }
