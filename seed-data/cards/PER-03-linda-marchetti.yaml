- id: KC-035
  type: failure_story
  status: approved
  title: "Harness clip rev D: new hole ballooned at the end, Aerovance kicked the package back"
  statement: >-
    On the harness clip rev D we started the first article from the rev C folder. The new hole went on at the end as
    balloon sixty-three, but Aerovance had it as characteristic twenty-one and renumbered everything after it. Their
    quality engineer kicked the whole package back the day after we sent it. The parts shipped on time, but redoing
    it cost us most of two days.
  applies_when: []
  does_not_apply_when: []
  rationale: null
  cues: ["a new rev that adds a feature"]
  actions: []
  common_mistake: "Handing off a new rev without saying the customer renumbers."
  expert_confidence: not_stated
  topics: [t-fai-cmm, t-cus-01]
  tags: [first-article, cmm]
  links: { jobs: [J-A04], customer: CUS-01 }
  source: { kind: interview, interview: INT-05 }
  evidence:
    - { turn: INT-05-T010, quote: "She pulled the rev C folder, the old ballooned drawing and the old CMM program, and worked from those." }
    - { turn: INT-05-T010, quote: "She added the new hole at the end as balloon sixty-three, the way you'd do it on our own format. Aerovance had put it in as characteristic twenty-one and renumbered everything after it." }
    - { turn: INT-05-T010, quote: "Friday morning their quality engineer kicked the whole package back." }
    - { turn: INT-05-T010, quote: "The parts still shipped on time, but it cost us most of two days." }
    - { turn: INT-05-T012, quote: "I handed it to her and didn't tell her Aerovance renumbers on a new rev." }
  approved: { by: PER-03, on: "2026-06-26", mode: self }
  created_on: "2026-06-25"

- id: KC-036
  type: inspection_gotcha
  status: approved
  title: "Let parts soak to room temperature on the granite before measuring anything tight"
  statement: >-
    Parts come off the machine warm, and a warm aluminum part measures big — two tenths big on a two-inch bore
    straight off the machine. Anything under a thou of total tolerance soaks on the granite until it's at room
    temperature: usually an hour for a small aluminum part, overnight for a big stainless block.
  applies_when: ["total tolerance under a thou", "parts straight off the machine"]
  does_not_apply_when: ["a loose part at plus or minus five thou"]
  rationale: "Parts come off the machine warm, from the cut and the coolant, and a warm part measures big."
  cues: ["\"the CMM's wrong\" on a part that just came off the machine"]
  actions:
    - "let the part soak on the granite until it's at room temperature"
    - "leave a big stainless block overnight"
  common_mistake: "Measuring a warm part and blaming the CMM."
  thresholds:
    - { quantity: total tolerance, comparator: "<", value: 0.001, unit: in, verbatim: "under a thou of total tolerance" }
  expert_confidence: always
  topics: [t-m-cmm, t-tight-tol]
  tags: [cmm, tight-tolerance]
  links: { machine: m-cmm }
  source: { kind: interview, interview: INT-06 }
  evidence:
    - { turn: INT-06-T020, quote: "Parts come off the machine warm, from the cut and the coolant." }
    - { turn: INT-06-T020, quote: "So I let parts soak on the granite until they're at room temperature before I measure anything tight. For a small aluminum part that's usually an hour. A big stainless block, I leave it overnight." }
    - { turn: INT-06-T022, quote: "On a two-inch aluminum bore straight off the machine, I've seen two tenths big." }
    - { turn: INT-06-T024, quote: "Anything under a thou of total tolerance always soaks, no arguments.", confidence: true }
    - { turn: INT-06-T024, quote: "A loose part at plus or minus five thou, I'm not going to make the floor wait an hour for it." }
  approved: { by: PER-03, on: "2026-08-06", mode: self }
  created_on: "2026-08-05"

- id: KC-037
  type: inspection_gotcha
  status: approved
  title: "Align CMM programs to the print datums, never to the faces the part was clamped on"
  statement: >-
    Always align to the datums on the print, never to the faces the machinist clamped on. Align to how the part was
    held and you're checking the machine's repeatability, not the part — every number on the report is perfect and
    wrong.
  applies_when: ["any CMM report that goes in the job folder as the inspection"]
  does_not_apply_when: ["an in-process setup check run off the machinist's setup faces, marked setup check"]
  rationale: "The print datums are how the part gets used."
  cues: ["an alignment that uses a feature that isn't a datum", "a whole lot that comes out dead nominal"]
  actions:
    - "hold the program's alignment next to the datum frame on the print"
    - "write setup check across the top of any report run off setup faces"
  common_mistake: "Aligning the program to how the part sat in the vise."
  expert_confidence: always
  topics: [t-m-cmm, t-fai-cmm]
  tags: [cmm, scrap]
  links: { machine: m-cmm }
  source: { kind: interview, interview: INT-06 }
  evidence:
    - { turn: INT-06-T014, quote: "Align to how the part was held and you're checking the machine's repeatability, not the part. The print datums are how the part gets used. So I always align to the datums on the print, never to the faces the machinist clamped on.", confidence: true }
    - { turn: INT-06-T006, quote: "if you align to the wrong thing, every number on the report is perfect and wrong." }
    - { turn: INT-06-T010, quote: "I aligned it to the top face and the first bore, because that's how the part sat in the vise." }
    - { turn: INT-06-T016, quote: "Look at the alignment at the top of the program and hold it next to the datum frame on the print. If the alignment uses a feature that isn't a datum, stop and ask why. And be suspicious when a whole lot comes out dead nominal." }
    - { turn: INT-06-T018, quote: "But that report never goes in the job folder as the inspection. I write setup check across the top of it." }
  approved: { by: PER-03, on: "2026-08-06", mode: self }
  created_on: "2026-08-05"

