- id: KC-039
  type: inspection_gotcha
  status: approved
  title: "Tight bores: scan or take at least eight points, never three"
  statement: >-
    Never take three points on a tight bore and call it round. A reamed or bored hole can come out lobed, and three
    points can land right on the high spots — it reads perfect and it's out of round. On anything tight, scan the
    bore or take at least eight points, at two depths.
  applies_when: ["bores with a tight tolerance"]
  does_not_apply_when: []
  rationale: "Three points can sit on the high spots of a lobed hole."
  cues: ["a tight bore that reads perfectly round from a few points"]
  actions:
    - "scan the bore"
    - "or take at least eight points, at two depths"
  common_mistake: "Taking three points on a bore and calling it round."
  thresholds:
    - { quantity: points on a tight bore, comparator: ">=", value: 8, unit: null, verbatim: "at least eight points" }
  expert_confidence: always
  topics: [t-m-cmm, t-tight-tol]
  tags: [cmm, tight-tolerance]
  links: { machine: m-cmm }
  source: { kind: interview, interview: INT-06 }
  evidence:
    - { turn: INT-06-T030, quote: "Take three points on a bore and call it round. A reamed or bored hole can come out lobed, with high spots, and three points can land right on them. It reads perfect and it's out of round." }
    - { turn: INT-06-T030, quote: "We saw that on a stainless valve body last year: three points said round, the scan said two tenths out." }
    - { turn: INT-06-T030, quote: "On anything tight I always scan the bore, or take at least eight points, at two depths.", confidence: true }
  approved: { by: PER-03, on: "2026-08-06", mode: self }
  created_on: "2026-08-05"

- id: KC-040
  type: setup_tip
  status: approved
  title: "Hold parts on the CMM lightly, sitting the way the print datums say"
  statement: >-
    Hold the part as lightly as it'll let you — clay, a couple of light clamps, the fixture plate with the rests —
    sitting the way the print datums say, datum A down on the rests if you can. Never clamp across a feature you're
    measuring, and never hard enough to pull the part flat. On a part we'll see again, photograph the setup for the
    program folder.
  applies_when: ["any part going on the CMM"]
  does_not_apply_when: []
  rationale: "It has to sit so it can't move but isn't squeezed."
  cues: ["a part that needs clamping to sit still"]
  actions:
    - "sit datum A down on the rests if you can"
    - "never clamp across a feature you're measuring"
    - "photograph the setup and put it in the program folder so the next run sits the same way"
  common_mistake: "Clamping hard enough to pull the part flat."
  expert_confidence: always
  topics: [t-m-cmm, t-fai-cmm]
  tags: [cmm, workholding]
  links: { machine: m-cmm }
  source: { kind: interview, interview: INT-06 }
  evidence:
    - { turn: INT-06-T004, quote: "Hold it so it can't move but isn't squeezed." }
    - { turn: INT-06-T026, quote: "As lightly as it'll let you. Clay, a couple of light clamps, the fixture plate with the rests. It has to sit the way the print datums say, datum A down on the rests if you can." }
    - { turn: INT-06-T026, quote: "Never clamp across a feature you're measuring, and never clamp hard enough to pull the part flat.", confidence: true }
    - { turn: INT-06-T026, quote: "If it's a part we'll see again, I take a photo of the setup and put it in the program folder, so the next run sits the same way." }
  approved: { by: PER-03, on: "2026-08-06", mode: self }
  created_on: "2026-08-05"

- id: KC-041
  type: machine_quirk
  status: approved
  title: "RP-Q01 CONTURA: check the air gauge and drain the filter bowl before the first run"
  statement: >-
    Since water got into RP-Q01's air line in the summer of 2023, always check its air pressure gauge and drain its
    filter bowl first thing in the morning, before anything runs. When the pressure's low it moves rough and the
    first readings wander.
  applies_when: ["RP-Q01 CONTURA", "first run of the day"]
  does_not_apply_when: []
  rationale: "Water got into this unit's air line once; when the pressure's low it moves rough and the readings wander."
  cues: ["low reading on the air pressure gauge", "water in the filter bowl", "first readings of the day wandering"]
  actions:
    - "check the air pressure gauge"
    - "drain the filter bowl before anything runs"
  common_mistake: "Blaming the part when the first readings of the day wander."
  expert_confidence: always
  topics: [t-m-cmm]
  tags: [cmm]
  links: { machine: m-cmm }
  source:
    kind: manual
    text: >-
      RP-Q01, the CONTURA — since the shop compressor's dryer quit in the summer of 2023 and put water in the CMM's
      air line, I always check its air pressure gauge and drain its filter bowl first thing in the morning, before
      anything runs. When the pressure's low it moves rough and the first readings wander. We put a second filter
      on its line after that.
    note: Hand-entered at the inspection room terminal.
  classification: general
  approved: { by: PER-03, on: "2025-04-16", mode: self }
  created_on: "2025-04-14"

- id: KC-042
  type: customer_quirk
  status: approved
  title: "Halvorsen: check every heat treat and passivation cert against their approved sources"
  statement: >-
    Before a Halvorsen lot ships, check every heat treat and passivation cert: the vendor on their approved source
    list, the spec and revision matching their PO, the part number and quantity matching our traveler. Their
    receiving always checks the same things, and one wrong spec revision holds the whole lot at their dock.
  applies_when: ["Halvorsen lot with heat treat or passivation"]
  does_not_apply_when: []
  rationale: "Their receiving checks every cert against their approved source list."
  cues: ["a cert from a vendor or a spec revision you haven't seen on their POs"]
  actions:
    - "check the vendor against Halvorsen's approved source list"
    - "match the spec and revision to the PO"
    - "match the part number and quantity to our traveler"
    - "get a wrong cert reissued before the lot ships, not after"
  common_mistake: "Passing a vendor's cert through without checking it against the PO and the approved source list."
  expert_confidence: always
  topics: [t-cus-02, t-outside-proc]
  tags: [outside-processing, heat-treat, traceability]
  links: { customer: CUS-02 }
  source:
    kind: manual
    text: >-
      Halvorsen — before a lot ships I check every heat treat and passivation cert myself. The vendor has to be on
      their approved source list, the spec and revision have to match their PO, and the part number and quantity
      have to match our traveler. Their receiving always checks the same things, and one wrong spec revision on a
      cert holds the whole lot at their dock. If a cert is wrong, I get the vendor to reissue it before we ship, not
      after.
    note: Entered by Linda.
  approved: { by: PER-03, on: "2025-09-24", mode: self }
  created_on: "2025-09-22"

- id: KC-043
  type: customer_quirk
  status: approved
  title: "Sutrella: finish on the working end every lot, every piece under the scope, no marking"
  statement: >-
    Sutrella checks surface finish on the working end of their 316 instruments at incoming, every lot, and looks at
    every piece under magnification for burrs. Check finish on the first and last piece of every lot with the
    profilometer, put every working end under the scope, not a sample, and never mark the part or use tape flags —
    they reject for residue.
  applies_when: ["Sutrella 316 instruments"]
  does_not_apply_when: []
  rationale: "They find a burr you can't feel with a fingernail."
  cues: ["an instrument with a working end or a finish callout"]
  actions:
    - "check finish on the first and last piece of every lot with the profilometer"
    - "look at every working end under the scope, not a sample"
    - "no marker and no tape flags on the part"
  common_mistake: "Inspecting a sample and flagging parts with tape."
  expert_confidence: always
  topics: [t-cus-03, t-mat-316]
  tags: [medical, deburr, cleanliness]
  links: { customer: CUS-03 }
  source:
    kind: manual
    text: >-
      Sutrella checks surface finish on the working end of their 316 instruments at incoming, every lot, and they look
      at every piece under magnification for burrs. They'll find a burr you can't feel with a fingernail. So we always
      check finish on the first and last piece of every lot with the profilometer, and every working end goes under
      the scope here, not a sample. No marker on the part and no tape flags. They reject for residue.
    note: Entered by Linda.
  approved: { by: PER-03, on: "2025-11-21", mode: self }
  created_on: "2025-11-19"

- id: KC-044
  type: customer_quirk
  status: approved
  title: "Graymoor source inspector: be ready to re-run any feature on the CMM while they watch"
  statement: >-
    Graymoor's source inspector always picks a few characteristics off the drawing and has us re-run them on the CMM
    while they watch. Build the program so any feature can run by itself, named by its balloon number, and have the
    first article parts, the ballooned drawing, the CMM reports and every cert laid out before they walk in.
  applies_when: ["Graymoor", "source inspection on the first lot of a new part number"]
  does_not_apply_when: []
  rationale: "The week before ship is for getting ready for the inspector, not for finishing the first articles."
  cues: ["a source inspection date on the schedule"]
  actions:
    - "build the CMM program so any feature can run by itself, named by its balloon number"
    - "lay out the first article parts, ballooned drawing, CMM reports and certs before the inspector arrives"
    - "keep drawings and reports in the inspection room while they're here"
  common_mistake: "Having only a program for the whole part, so every characteristic they pick means running the whole part."
  expert_confidence: always
  topics: [t-cus-05, t-fai-cmm]
  tags: [defense, first-article, cmm]
  links: { customer: CUS-05, jobs: [J-A10] }
  source:
    kind: manual
    text: >-
      Graymoor's source inspector — Ray's right that the first articles have to be done a week before ship. On my
      side that week is for getting ready for them. The first article parts, the ballooned drawing, the CMM reports
      and every cert are laid out before they walk in. They always pick a few characteristics off the drawing and
      have us re-run them on the CMM while they watch, so I build the program so any feature can run by itself,
      named by its balloon number. On the manifold they picked five, and we had each one on the screen in a couple
      of minutes. If all you have is a program for the whole part, you're running the whole part five times.
      Drawings and reports stay in the inspection room while they're here.
    note: Entered by Linda after the manifold job.
  approved: { by: PER-03, on: "2026-07-22", mode: self }
  created_on: "2026-07-20"

- id: KC-045
  type: quoting_rule
  status: approved
  title: "Heat-treated 17-4 with close bores: quote a CMM check at incoming and at final"
  statement: >-
    When a 17-4 part with close bores gets heat treated, quote inspection time twice: a CMM check at incoming from
    the heat treater, before it goes back on a machine, and again at final. On the Halvorsen end cap I caught the
    bores out of round at incoming.
  applies_when: ["17-4 part with close bores and a heat treat callout"]
  does_not_apply_when: []
  rationale: "If the parts go straight back on the machine, nobody knows how much stock is left for the finish op."
  cues: ["close bores plus a heat treat callout"]
  actions:
    - "quote a CMM check at incoming from the heat treater"
    - "quote inspection again at final"
    - "put the incoming check in the schedule, not squeezed in"
  common_mistake: "Sending heat-treated parts straight back to the machine without an incoming check."
  expert_confidence: always
  topics: [t-outside-proc, t-mat-174ph, t-fai-cmm]
  tags: [heat-treat, outside-processing, cmm, tight-tolerance]
  links: { jobs: [J-A08] }
  source:
    kind: manual
    text: >-
      Anything that comes back from the heat treater gets a CMM check at incoming before it goes back on a machine.
      On the Halvorsen end cap I caught the bores out of round at incoming. If they'd gone straight back on the
      Genos, nobody would have known how much stock was left for the finish op. So when a 17-4 part with close bores
      gets heat treated, I always want inspection quoted twice: once at incoming from the heat treater and once at
      final. And the incoming check has to be in the schedule, not squeezed in.
    note: Entered by Linda after the end cap job.
  approved: { by: PER-03, on: "2025-12-12", mode: self }
  created_on: "2025-12-10"

- id: KC-046
  type: inspection_gotcha
  status: approved
  title: "Sutrella drill guide: gauge-pin the guide bore from both ends, not just the CMM"
  statement: >-
    On the Sutrella drill guide, check the guide bore with gauge pins from both ends, not just the CMM from the top —
    the stylus only reaches in so far. Do the final check after passivation, at room temperature.
  applies_when: ["small, long bores like the drill guide's guide bore"]
  does_not_apply_when: []
  rationale: "The stylus only reaches in so far."
  cues: ["a long bore that checks fine at the top on the CMM"]
  actions:
    - "check the guide bore with gauge pins from both ends"
    - "do the final check after passivation, at room temperature"
  common_mistake: "Trusting the CMM reading at the top of a long bore."
  expert_confidence: always
  topics: [t-mat-316, t-cus-03, t-tight-tol]
  tags: [medical, tight-tolerance, cmm]
  links: { jobs: [J-G051], customer: CUS-03 }
  source:
    kind: manual
    text: >-
      Sutrella drill guide — check the guide bore with gauge pins from both ends, not just the CMM from the top. The
      stylus only reaches in so far. On the July lot the bore checked fine on the CMM at the top, and the pin wouldn't
      go from the other end. Between that and the undersize bundle Tomás found that week, we re-measured everything
      and offset. On a bore with a tolerance that tight, I always pin these from both ends now, after passivation, at
      room temperature.
    note: Entered by Linda after the drill guide job.
  approved: { by: PER-03, on: "2025-07-23", mode: self }
  created_on: "2025-07-21"
