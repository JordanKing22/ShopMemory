- id: KC-030
  type: inspection_gotcha
  status: approved
  title: "New rev: balloon the new drawing from scratch, never from the old ballooned copy"
  statement: >-
    Never start a new revision from the old ballooned drawing. Balloon the new drawing from scratch and check our
    numbers against the customer's characteristic list line by line before the CMM program gets touched. You can't
    tell by looking at what changed whether they renumbered.
  applies_when: ["new revision of a part we've run before"]
  does_not_apply_when: ["repeat order on the same rev"]
  rationale: "You can't tell by looking at what changed. That's the trap."
  cues: ["a new rev letter on a part with an old job folder"]
  actions:
    - "balloon the new drawing from scratch"
    - "check our balloon numbers against the customer's characteristic list line by line"
    - "do it before the CMM program gets touched"
  common_mistake: "Trusting the old folder: last rev's ballooned drawing and CMM program."
  expert_confidence: always
  topics: [t-fai-cmm, t-cus-01]
  tags: [first-article, cmm]
  links: { jobs: [J-A04], customer: CUS-01 }
  source: { kind: interview, interview: INT-05 }
  evidence:
    - { turn: INT-05-T016, quote: "You can't tell by looking at what changed. That's the trap. So I never start a new rev from the old ballooned drawing. I balloon the new drawing from scratch and check our numbers against their characteristic list line by line before the CMM program gets touched.", confidence: true }
    - { turn: INT-05-T018, quote: "A repeat order on the same rev, sure. Same drawing, same numbers, same program." }
    - { turn: INT-05-T030, quote: "Trust the old folder." }
  approved: { by: PER-03, on: "2026-06-26", mode: self }
  created_on: "2026-06-25"

- id: KC-031
  type: inspection_gotcha
  status: approved
  title: "The CMM report isn't the first article: every note gets a balloon and a result"
  statement: >-
    Every note on the drawing is a characteristic — edge breaks, part marking, the finish, the material spec — and
    gets a balloon. Anything the CMM can't measure still needs its own line with the result and how you checked it.
    Most of the time a package comes back, it's a note nobody ballooned.
  applies_when: ["any first article package"]
  does_not_apply_when: []
  rationale: null
  cues: ["notes on the drawing with no balloon"]
  actions:
    - "balloon every note, not just the dimensions"
    - "give everything the CMM can't measure its own line with the result and how you checked it (visual, gauge pin, profilometer, cert number)"
  common_mistake: "Measuring every dimension perfectly and forgetting the notes and the certs."
  expert_confidence: usually
  topics: [t-fai-cmm]
  tags: [first-article, cmm]
  links: { jobs: [J-A04] }
  source: { kind: interview, interview: INT-05 }
  evidence:
    - { turn: INT-05-T006, quote: "The notes are where people miss things — edge breaks, marking, the finish note, the material spec. Every one of those is a characteristic and gets a balloon." }
    - { turn: INT-05-T020, quote: "Most of the time when a package comes back from anybody, it's a note nobody ballooned", confidence: true }
    - { turn: INT-05-T020, quote: "The CMM report isn't the first article. Anything the CMM can't measure still needs its own line, with the result and how you checked it: visual, gauge pin, profilometer, the cert number." }
    - { turn: INT-05-T030, quote: "They'll measure every dimension perfectly and forget the notes and the certs." }
    - { turn: INT-05-T032, quote: "Every note gets a balloon and a result, not just the dimensions." }
  approved: { by: PER-03, on: "2026-06-26", mode: self }
  created_on: "2026-06-25"

- id: KC-032
  type: customer_quirk
  status: approved
  title: "Aerovance FAI: raw CMM printout behind their form, features named by balloon"
  statement: >-
    Aerovance wants the raw CMM printout behind their first article form, with our balloon numbers on the printout
    too, so name the features in the CMM program by balloon number. A printout that doesn't match the form is another
    kickback. And on a new revision they won't take a partial: every characteristic gets measured again and reported.
  applies_when: ["Aerovance first article package"]
  does_not_apply_when: ["repeat order on the same rev"]
  rationale: "Their receiving inspection loads our numbers against their characteristic list."
  cues: ["a printout that says circle twelve where the form says balloon twenty-one"]
  actions:
    - "attach the raw CMM printout behind their form"
    - "name the features in the CMM program by balloon number"
    - "do a full first article on every new rev, even when only a note changed"
  common_mistake: "Sending a printout with the CMM's own feature names, so it doesn't line up with their form."
  expert_confidence: always
  topics: [t-cus-01, t-fai-cmm]
  tags: [first-article, cmm]
  links: { customer: CUS-01, jobs: [J-A04] }
  source: { kind: interview, interview: INT-05 }
  evidence:
    - { turn: INT-05-T018, quote: "But a new rev, even if the only change is a note, gets a full first article. Aerovance won't take a partial first article on a new revision. Every characteristic gets measured again and reported, every time.", confidence: true }
    - { turn: INT-05-T022, quote: "And they want the raw CMM printout behind the form, with our balloon numbers on the printout too." }
    - { turn: INT-05-T022, quote: "If the printout says circle twelve and the form says balloon twenty-one, that's another kickback. So I name the features in the CMM program by balloon number." }
    - { turn: INT-05-T014, quote: "Their receiving inspection loads our numbers against their characteristic list." }
  approved: { by: PER-03, on: "2026-06-26", mode: self }
  created_on: "2026-06-25"

- id: KC-033
  type: quoting_rule
  status: approved
  title: "First article time goes with the balloon count, not the size of the part"
  statement: >-
    First article time usually goes with the balloon count, not the size of the part. The harness clip is small and
    has sixty-three balloons: about three hours all in on a new rev with a CMM program we could edit. A new part
    number with no program, figure a full day. Ask quality for the balloon count and whether a program exists, and
    quote the first article as its own time.
  applies_when: ["part that needs a first article"]
  does_not_apply_when: ["repeat order on the same rev"]
  rationale: "Ballooning and checking the numbers is an hour of that. The CMM run is the short part."
  cues: ["a first article callout on the PO or the drawing"]
  actions:
    - "ask quality for the balloon count and whether a CMM program exists"
    - "allow about three hours when there's a program to edit"
    - "figure a full day for a new part number with no program"
    - "quote the first article as its own time, not buried in the cycle"
  common_mistake: "Guessing first article time from how big the part is."
  thresholds:
    - { quantity: first article time with a CMM program to edit, comparator: approx, value: 3, unit: h, verbatim: "about three hours all in" }
  expert_confidence: usually
  topics: [t-fai-cmm]
  tags: [first-article, quoting, cmm]
  links: { quotes: [Q-A04], jobs: [J-A04] }
  source: { kind: interview, interview: INT-05 }
  evidence:
    - { turn: INT-05-T024, quote: "When it goes right, a first article like the harness clip is about three hours all in, and that's with a CMM program we could edit from rev C." }
    - { turn: INT-05-T024, quote: "Ballooning and checking the numbers is an hour of that. The CMM run is the short part." }
    - { turn: INT-05-T024, quote: "A new part number with no program, figure a full day. The time usually goes with the balloon count, not the size of the part. The harness clip is small and it has sixty-three balloons.", confidence: true }
    - { turn: INT-05-T026, quote: "I tell him the balloon count and whether we already have a program. He quotes the first article as its own time, not buried in the cycle." }
  approved: { by: PER-03, on: "2026-06-26", mode: self }
  created_on: "2026-06-25"

- id: KC-034
  type: inspection_gotcha
  status: approved
  title: "Thin walls: measure after the part has sat unclamped, never in the fixture"
  statement: >-
    On thin walls, always let the part sit unclamped for an hour before you measure wall thickness on the CMM.
    Measured in the fixture, it lies.
  applies_when: ["thin walls"]
  does_not_apply_when: []
  rationale: "In the fixture it lies."
  cues: ["a wall that passes in the fixture and fails at final"]
  actions: ["unclamp and let the part sit before measuring"]
  common_mistake: "Measuring wall thickness in the fixture."
  expert_confidence: always
  topics: [t-thin-wall]
  tags: [thin-wall, cmm, springback]
  links: { jobs: [J-A03], machine: m-cmm }
  source:
    kind: manual
    text: >-
      Thin walls — always let the part sit unclamped for an hour before you measure wall thickness on the CMM. In the
      fixture it lies.
    note: Entered by Linda after the duct support bracket.
