- id: KC-064
  type: quoting_rule
  status: approved
  title: "Quantrel chamber plates: put deburr, clean and bag in the hours as its own step"
  statement: >-
    On Quantrel 6061 chamber plates, always put the deburr, clean and bag in the hours as its own step — about
    fifteen minutes a plate on the chamber lid. The floor does it every time, whether the quote has it or not.
  applies_when: ["Quantrel 6061 chamber plate with a cleaning and bagging requirement"]
  does_not_apply_when: ["plates with no cleaning or bagging requirement"]
  rationale: "The floor does it every time whether the quote has it or not."
  cues: ["cleaning and bagging requirement in the RFQ package"]
  actions:
    - "add deburr, clean and bag as its own step in the hours"
    - "figure about fifteen minutes a plate on a plate like the chamber lid"
  common_mistake: "Quoting only the machining time from the CAM estimate."
  expert_confidence: always
  topics: [t-quoting, t-mat-6061, t-cus-04]
  tags: [quoting, cleanliness, deburr, semiconductor, aluminum]
  links: { quotes: [Q-A11], jobs: [J-A11], customer: CUS-04 }
  source:
    kind: manual
    text: >-
      Quantrel 6061 chamber plates: I always put the deburr, clean and bag in the hours as its own step. On the
      chamber lid it was about fifteen minutes a plate. The first time I left it out, Ray asked me where it was. The
      floor does it every time whether the quote has it or not, so if it's not in the hours we just don't get paid
      for it.
    note: Entered by Maya after the chamber lid job shipped.
  approved: { by: PER-05, on: "2026-07-01", mode: self }
  created_on: "2026-06-29"

- id: KC-065
  type: quoting_rule
  status: rejected
  title: "Repeat Aerovance parts: skip the first article if an earlier lot already had it"
  statement: >-
    On repeat Aerovance parts, like the 17-4 tube-end fitting, leave the first article out of the new quote when an
    earlier lot already had a first article. It was done once and they already have the package.
  applies_when: ["repeat Aerovance part"]
  does_not_apply_when: []
  rationale: "It was done once and they have the package."
  cues: ["the part number has shipped before"]
  actions: ["leave the first article out of the repeat quote"]
  common_mistake: null
  expert_confidence: not_stated
  topics: [t-quoting, t-cus-01]
  tags: [quoting, first-article, stainless]
  links: { quotes: [Q-G017], customer: CUS-01 }
  source:
    kind: manual
    text: >-
      Repeat Aerovance parts, like the 17-4 tube-end fitting: if an earlier lot already had a first article, I leave
      the first article out of the new quote. It was done once and they have the package.
    note: Entered by Maya after quoting the repeat tube-end fitting.
  review_notes: >-
    Rejected by Ray. A first article on an earlier lot doesn't settle it. A repeat part still needs a new first
    article when the revision changed since the last one, or when the customer's quality clauses on the new PO call
    for one. Before you leave it out, check the rev on the RFQ against the old package and read the PO's quality
    clauses. If you're not sure, ask Linda, and quote it in.
  created_on: "2026-04-27"

- id: KC-066
  type: quoting_rule
  status: draft
  title: "7075 brackets with anodize: ask the anodizer if masking is in their number"
  statement: >-
    On 7075 brackets with anodize, ask the anodizer in writing whether masking is in their number before we quote.
    If the print masks threads or a bore and nobody asked, the masking gets done here and it's not in the hours.
  applies_when: ["7075 bracket with an anodize callout", "masked threads or bores on the print"]
  does_not_apply_when: ["no masking on the print"]
  rationale: "Somebody here ends up doing the masking and it's not in the hours."
  cues: ["masking note on the anodize callout"]
  actions:
    - "ask the anodizer in writing whether masking is included"
    - "add masking time to the hours if we do it ourselves"
  common_mistake: "Assuming the anodize line covers masking."
  expert_confidence: not_sure
  topics: [t-quoting, t-outside-proc, t-mat-7075]
  tags: [quoting, outside-processing, aluminum]
  links: { quotes: [Q-A15] }
  source:
    kind: manual
    text: >-
      7075 brackets with anodize: I think we should ask the anodizer whether masking is in their number, in
      writing, before we quote. If the print masks threads or a bore and nobody asked, somebody here ends up doing
      the masking and it's not in the hours. I'm not sure yet how much time to put in when we mask it ourselves. I
      want to ask Ray.
    note: Draft entered by Maya after the spare bracket quote; she wants Ray to look at it before review.
  open_questions: ["How much time should the quote allow when we do the masking ourselves?"]
  created_on: "2026-08-24"

