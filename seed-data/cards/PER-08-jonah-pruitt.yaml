    article the CAM program doesn't change without their OK, not even a small edit at the control. Post any edit as
    a new program rev, keep the old one in the folder, and Linda tells them before it runs on their parts.
  applies_when: ["Sutrella parts with an approved first article"]
  does_not_apply_when: []
  rationale: null
  cues: ["an edit to a program for a Sutrella part", "a request to tweak a Sutrella program at the control"]
  actions:
    - "put the program number and revision on the traveler for every Sutrella lot"
    - "post any edit as a new program rev and keep the old one in the folder"
    - "have Linda tell Sutrella before the new rev runs on their parts"
  common_mistake: "Making a small edit to a Sutrella program at the control without a new rev."
  expert_confidence: always
  topics: [t-cus-03, t-cam]
  tags: [medical, cam, traceability]
  links: { customer: CUS-03, jobs: [J-G046] }
  source:
    kind: manual
    text: >-
      Sutrella wants the program number and revision on the traveler for every lot. Once they've approved a first
      article, the CAM program doesn't change without their OK, not even a small edit at the control. I always post
      an edit as a new program rev and keep the old one in the folder, and Linda tells them before it runs on their
      parts. When I added the back-chamfer toolpath to the probe tips after the July lot, that went in as a new rev,
      and Linda is getting their OK before the next lot.
    note: Entered by Jonah after the probe tip lot.
  approved: { by: PER-08, on: "2026-07-27", mode: self }
