- id: KC-081
  type: setup_tip
  status: approved
  title: "Integrex: probe the part face on the sub-spindle after every hand-off"
  statement: >-
    On the Integrex, post a probe touch on the part face right after the hand-off to the sub-spindle, and set the
    sub-spindle Z from that touch, not from the nominal. A chip on the stop and the part seats short.
  applies_when: ["parts handed off to the Integrex sub-spindle for back work"]
  does_not_apply_when: []
  rationale: "Get a chip on the stop and the part seats short."
  cues: ["back-face length wandering part to part"]
  actions:
    - "post a probe touch on the part face after the hand-off"
    - "set the sub-spindle Z from the probe touch"
  common_mistake: "Trusting the stop and the nominal Z."
  expert_confidence: always
  topics: [t-m-integrex, t-cam]
  tags: [mill-turn, probing, cam]
  links: { jobs: [J-I03], machine: m-integrex }
  source:
    kind: manual
    text: >-
      On the Integrex I always post a probe touch on the part face right after the hand-off to the sub-spindle, and
      the CAM program sets the sub-spindle Z from that touch, not from the nominal. The new sub-spindle stop Tomás
      made in June sets the depth, but get a chip on the stop and the part seats short. The probe touch costs about
      twenty seconds a part and it has already saved a couple of back faces.
    note: Entered by Jonah after the sub-spindle stop work order.
  approved: { by: PER-08, on: "2026-07-08", mode: self }
  created_on: "2026-07-06"

- id: KC-082
  type: setup_tip
  status: approved
  title: "DMU 50 tool library: the stickout goes in the tool name"
  statement: >-
    Every tool in the DMU 50 CAM library carries its stickout in the name, and the setup sheet prints it. That's
    the shortest stickout that clears, so it's also Ray's shortest stickout: load the tool at that length, and ask
    for a re-post before you run a different stickout, shorter or longer.
  applies_when: ["programs for the DMU 50"]
  does_not_apply_when: []
  rationale: "The toolpath was checked for collisions at that stickout and no shorter."
  cues: ["stickout in the tool name on the setup sheet"]
  actions:
    - "put the stickout in the tool name in the CAM library"
    - "load each tool at the stickout in its name"
    - "ask for a re-post before running a different stickout"
  common_mistake: "Choking up on a tool to make it stiffer without telling programming."
  expert_confidence: always
  topics: [t-cam, t-m-dmu50]
  tags: [cam, dmu]
  links: { machine: m-dmu50 }
  source:
    kind: manual
    text: >-
      I always put the stickout in the tool name in our CAM library for the DMU 50, like 'EM 3/8 x 1.25 SO'. The
      toolpath was checked for collisions at that stickout and no shorter, so the setup sheet prints the name and
      whoever loads the tool knows the shortest stickout that clears. Marv asked for it after a holder rubbed a
      fixture. If you have to run a different stickout, tell me and I re-post. Ray's shortest-stickout rule still
      holds: the name is the shortest that clears; if you want it shorter, tell me and I re-post.
    note: Entered by Jonah.
  approved: { by: PER-08, on: "2025-10-08", mode: self }
  created_on: "2025-10-06"

- id: KC-083
  type: setup_tip
  status: approved
  title: "Genos: probe the blank before roughing and alarm out if it's oversize"
  statement: >-
    On the Genos, post a probe check of the blank before the first roughing pass. If the blank is more than thirty
    thou over what the program expects, alarm out instead of taking a full-depth first cut.
  applies_when: ["saw-cut blanks on the Genos"]
  does_not_apply_when: []
  rationale: "We had blanks come in long from the saw and the first pass took a heavy bite."
  cues: ["saw-cut blanks that vary in size"]
  actions:
    - "post a blank-size probe check before roughing"
    - "alarm out if the blank is more than thirty thou over"
    - "run the check after the warm-up"
  common_mistake: "Trusting the saw ticket for blank size."
  thresholds:
    - { quantity: blank oversize, comparator: ">", value: 0.030, unit: in, verbatim: "more than thirty thou over" }
  expert_confidence: always
  topics: [t-m-genos, t-cam]
  tags: [genos, probing, cam]
  links: { machine: m-genos }
  source:
    kind: manual
    text: >-
      On the Genos I always post a probe check of the blank before the first roughing pass. If the blank is more
      than thirty thou over what the CAM program expects, the macro alarms out instead of taking a full-depth first
      cut. We had blanks come in long from the saw and the first pass took a heavy bite. It runs after the warm-up,
      so the probe numbers are good.
    note: Entered by Jonah.
  approved: { by: PER-08, on: "2026-01-28", mode: self }
  created_on: "2026-01-26"

- id: KC-084
  type: setup_tip
  status: approved
  title: "VF-4 work offsets: G54 vise, G55 rotary, fixture plates from G56 up"
  statement: >-
    On the VF-4, keep the work offsets the same on every job: G54 is the vise, G55 the rotary, fixture plates from
    G56 up. The post writes the offset and what it's for as a comment at the top of the program, and the setup
    sheet matches.
  applies_when: ["any VF-4 program"]
  does_not_apply_when: []
  rationale: "Same offsets on every job means nobody has to guess what an old program used."
  cues: ["an old program that uses a different offset"]
  actions:
    - "use G54 for the vise, G55 for the rotary and G56 and up for fixture plates"
    - "have the post write the offset as a comment at the top of the program"
  common_mistake: "Reusing whatever offset an old program happened to use."
  expert_confidence: always
  topics: [t-m-vf4, t-cam]
  tags: [vf4, cam, workholding]
  links: { machine: m-vf4 }
  source:
    kind: manual
    text: >-
      On the VF-4 we keep the work offsets the same on every job: G54 is the vise, G55 is the rotary, and fixture
      plates start at G56. My CAM post always writes the offset and what it's for as a comment on the first lines of
      the program, and the setup sheet says the same. A rotary job got set up on G54 once because an old program
      used it. Now nobody has to guess.
    note: Entered by Jonah.
  approved: { by: PER-08, on: "2025-09-17", mode: self }
  created_on: "2025-09-15"

- id: KC-085
  type: quoting_rule
  status: rejected
  title: "Swiss PEEK parts: quote the cycle time straight from the CAM simulation"
  statement: >-
    On Swiss PEEK parts, quote the cycle time straight from the CAM simulation. Adding bar changes and a buffer on
    top pads it twice.
  applies_when: ["PEEK parts on the Swiss"]
  does_not_apply_when: []
  rationale: "The simulator has been close on the L20."
  cues: []
  actions: ["use the CAM simulation cycle time as the quoted cycle time"]
  common_mistake: null
  expert_confidence: not_stated
  topics: [t-m-swiss, t-mat-peek, t-cam]
  tags: [swiss, peek, cam, quoting]
  links: { jobs: [J-G077], machine: m-swiss }
  source:
    kind: manual
    text: >-
      Swiss PEEK parts: the cycle time from the CAM simulation is close enough to quote from as is. On the L20 the
      simulator has been within a few percent on the standoffs. Adding bar changes and a buffer on top just pads it
      twice.
    note: Entered by Jonah after the standoff job.
  review_notes: >-
    Rejected by Tomás. The simulator time is a good starting point, but it doesn't see bar changes, the pick-off, or
    the stops we add to clear chips on PEEK, and it knows nothing about first-piece checks. Quoting stays with the
    quoter: send the simulator time with a note on what's in it and what isn't, and the quoter adds the rest once.
  created_on: "2026-05-12"

- id: KC-086
  type: machine_quirk
  status: approved
  title: "RP-M06 Swiss: post with canned cycles and subprograms; the memory fills up"
  statement: >-
    RP-M06's program memory fills up, and a long program posted as strings of short moves won't load next to the
    other jobs. Always post the Swiss with canned cycles and subprograms, and back up and clear old programs off it
    at the start of every month.
  applies_when: ["programs posted for RP-M06"]
  does_not_apply_when: []
  rationale: "It carries programs for a lot of small jobs, and its memory fills up."
  cues: ["memory-full alarm partway through a program transfer"]
  actions:
    - "post with canned cycles and subprograms instead of long strings of short moves"
    - "back up and clear old programs off the control at the start of every month"
  common_mistake: "Deleting another job's program at the control to make room."
  expert_confidence: always
  topics: [t-m-swiss, t-cam]
  tags: [swiss, cam]
  links: { machine: m-swiss }
  source:
    kind: manual
    text: >-
      Our Swiss, RP-M06, carries programs for a lot of small jobs, and its memory fills up. A long program posted as
      strings of short moves won't load next to the other jobs, and the control throws a memory-full alarm partway
      through the transfer. I always post the Swiss from CAM with canned cycles and subprograms, not long strings of
      short moves, and I back up and clear the old programs off it at the start of every month.
    note: Entered by Jonah after a transfer stopped on a memory-full alarm.
  classification: general
  approved: { by: PER-08, on: "2026-03-09", mode: self }
  created_on: "2026-03-05"

