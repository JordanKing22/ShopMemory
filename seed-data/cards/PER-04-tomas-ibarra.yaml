# ---------------------------------------------------------------- Manual entries (Tomás's own words)

- id: KC-057
  type: machine_quirk
  status: approved
  title: "RP-M05: sub-spindle sits about three tenths off the main spindle's center"
  statement: >-
    Our Integrex, RP-M05, has had its sub-spindle about three tenths off center from the main since we bought it
    used in 2014. Anything that has to run true end to end, always finish both diameters in the main spindle, or
    indicate the part in the sub before you trust the pick-off.
  applies_when: ["RP-M05 Integrex", "features that must run true to each other across the pick-off"]
  does_not_apply_when: []
  rationale: "This unit's sub-spindle has never lined up dead on with the main."
  cues: ["runout between the two ends after the pick-off"]
  actions: ["finish both diameters in the main spindle", "indicate the part in the sub-spindle before trusting the pick-off"]
  common_mistake: "Chasing the error in the program."
  thresholds:
    - { quantity: sub-spindle offset from main spindle center, comparator: approx, value: 0.0003, unit: in, verbatim: "about three tenths off center" }
  expert_confidence: always
  topics: [t-m-integrex, t-tight-tol]
  tags: [mill-turn, tight-tolerance]
  links: { machine: m-integrex }
  source:
    kind: manual
    text: >-
      Our Integrex, RP-M05, came to us used in 2014 from an oilfield shop, and the sub-spindle has never lined up
      dead on with the main. It sits about three tenths off center. So anything that has to run true from end to
      end, I always finish both diameters in the main spindle, or I indicate the part in the sub before I trust the
      pick-off. Don't chase it in the program.
    note: Hand-entered at the machine.
  classification: general
  approved: { by: PER-04, on: "2025-11-06", mode: self }
  created_on: "2025-11-04"

- id: KC-058
  type: machine_quirk
  status: approved
  title: "RP-M05 milling head: always swing the B-axis in from the same side"
  statement: >-
    The milling head on RP-M05 has had a little play through vertical since we got the machine in 2014. Always swing
    the B-axis to position from the same side and let the clamp lock before the first cut. Come at it from the
    other side and a cross hole ends up about a thou off location.
  applies_when: ["RP-M05 Integrex", "milled features after a B-axis swing"]
  does_not_apply_when: []
