- id: KC-051
  type: quoting_rule
  status: approved
  title: "Small Swiss parts: quote the handling as its own time, not just the cycle"
  statement: >-
    When you quote small parts on the Swiss, don't stop at the cycle time. Usually price the handling as its own
    time per part: deburr under the scope, measure after they cool, bag and count. On PEEK sleeves and spacers the
    handling after the machine takes longer than the cycle.
  applies_when: ["small parts on the Swiss", "PEEK sleeves and spacers"]
  does_not_apply_when: []
  rationale: "What people miss is the handling: deburr under the scope, measure after they cool, bag and count."
  cues: ["parts that need deburr under the scope", "parts that must cool before they're measured"]
  actions: ["price deburr, measuring, bagging and counting as their own time per part"]
  common_mistake: "Quoting a small Swiss part from the cycle time alone."
  expert_confidence: usually
  topics: [t-quoting, t-m-swiss, t-mat-peek]
  tags: [quoting, swiss, peek, deburr]
  links: { jobs: [J-G054], machine: m-swiss, material: mat-peek }
  source: { kind: interview, interview: INT-07 }
  evidence:
    - { turn: INT-07-T028, quote: "When I quote small parts on the Swiss, everybody looks at the cycle time. What people miss is the handling: deburr under the scope, measure after they cool, bag and count." }
    - { turn: INT-07-T028, quote: "On the PEEK sleeves and spacers the handling after the machine takes longer than the cycle." }
