- id: KC-054
  type: setup_tip
  status: approved
  title: "In718 on the Integrex: never let the tool dwell; finish at least ten thou deep"
  statement: >-
    On Inconel 718, never let the tool dwell: keep the feed on through the corners, always. Take at least ten thou on
    the finish pass so you cut under the skin the pass before hardened, move the depth a little on each roughing
    pass so the notch doesn't wear in the same spot, and keep flood coolant right at the edge.
  applies_when: ["turning Inconel 718 on the Integrex"]
  does_not_apply_when: []
  rationale: "If the feed stops in the cut, even for a second, it work hardens right there and the next pass hits a hard spot."
  cues: ["the cut going from a hiss to a squeal", "chip color changing"]
  actions:
    - "keep the feed on through the corners"
    - "take at least ten thou on the finish pass"
    - "move the depth a little on each roughing pass"
    - "flood coolant right at the edge; never run it dry"
    - "rough with round inserts in a tough carbide grade made for the heat-resistant alloys"
  common_mistake: "Taking a light spring pass to clean up the finish, like on stainless."
  thresholds:
    - { quantity: finish pass depth, comparator: ">=", value: 0.010, unit: in, verbatim: "at least ten thou" }
  expert_confidence: always
  topics: [t-m-integrex, t-mat-in718]
  tags: [inconel, mill-turn, tool-wear]
  links: { machine: m-integrex, jobs: [J-A07], material: mat-in718 }
  source: { kind: interview, interview: INT-08 }
  evidence:
