- id: KC-061
  type: quoting_rule
  status: approved
  title: "Swiss or ST-20: long parts in small bar go on the Swiss"
  statement: >-
    When I quote a turned part that fits in 3/4 inch bar and is longer than about three times its diameter, it
    usually goes on the Swiss: the guide bushing holds it at the cut, so it comes off done in one op. Short, fat
    parts, or anything bigger than the Swiss takes, go on the ST-20.
  applies_when: ["part fits in 3/4 inch bar", "part longer than about three times its diameter"]
  does_not_apply_when: ["short, fat parts", "bar bigger than the Swiss takes"]
  rationale: "The guide bushing supports a long part right at the cut, so it comes off done."
  cues: ["a long, slender turned part on the print"]
  actions: ["put long parts in small bar on the Swiss", "put short, fat or large-bar parts on the ST-20"]
  common_mistake: "Quoting a long slender part on the ST-20 and paying for a second op."
  thresholds:
    - { quantity: length to diameter, comparator: ">", value: 3, unit: x, verbatim: "longer than about three times its diameter" }
  expert_confidence: usually
  topics: [t-quoting, t-m-swiss, t-m-st20]
  tags: [quoting, swiss, st20]
  links: { jobs: [J-G077, J-G074], machines: [m-swiss, m-st20] }
  source:
    kind: manual
    text: >-
      How I pick the machine when I quote a turned part: if it fits in 3/4 inch bar and it's longer than about three
      times its diameter, it usually goes on the Swiss. The guide bushing holds it right at the cut, so it comes off
      done in one op. Short, fat parts, or anything bigger than the Swiss takes, go on the ST-20. The PEEK standoffs
      went on the Swiss and came in under the hours. The lift pins went on the ST-20 because the Swiss was booked.
      They ran fine, but it took a second op to finish the far end.
    note: Entered by Tomás after the standoff job.
  approved: { by: PER-04, on: "2026-05-15", mode: self }
  created_on: "2026-05-12"

- id: KC-062
  type: quoting_rule
  status: approved
  title: "Swiss material: count parts per bar, with the cut-off and the remnant"
  statement: >-
    On small Swiss parts, figure material by bars, not by part length. Every part eats its length plus the cut-off,
    about sixty thou, plus a little facing stock, and every bar leaves a remnant of about eight inches. Always count
    how many parts you get out of one bar and quote whole bars, rounded up.
  applies_when: ["small parts from bar on the Swiss"]
  does_not_apply_when: []
  rationale: "Every bar leaves a remnant the machine can't use, and on the short PEEK caps that adds up fast."
  cues: ["short parts, like PEEK caps"]
  actions: ["count parts per bar including the cut-off and facing stock", "quote whole bars and round up"]
  common_mistake: "Figuring material from part length times quantity."
  thresholds:
    - { quantity: cut-off width per part, comparator: approx, value: 0.060, unit: in, verbatim: "about sixty thou" }
    - { quantity: bar remnant, comparator: approx, value: 8, unit: in, verbatim: "about eight inches" }
  expert_confidence: always
  topics: [t-quoting, t-m-swiss, t-mat-peek]
  tags: [quoting, swiss, peek]
  links: { jobs: [J-G057], machine: m-swiss, material: mat-peek }
  source:
    kind: manual
    text: >-
      Small parts on the Swiss, I figure the material by bars, not by part length. Every part eats its own length
      plus the cut-off, about sixty thou, plus a little facing stock. Every bar leaves a remnant of about eight
      inches the machine can't use. On the short PEEK caps that adds up fast. I always count how many parts I get
      out of one bar, quote it in whole bars, and round up, because nobody sells us half a bar.
    note: Entered by Tomás after the PEEK cap job.
  approved: { by: PER-04, on: "2026-09-03", mode: self }
  created_on: "2026-08-31"

- id: KC-063
  type: failure_story
  status: approved
  title: "Pivot shafts: sized warm at the machine, two tenths under once cold"
  statement: >-
    On the 17-4 pivot shafts I sized the bearing diameters at the machine with the parts still warm from the cut.
    Next morning inspection had them two tenths under on the tightest diameter. Nothing was scrapped, but every
    shaft got held until it was cold and measured twice, and the job ran an hour over.
  applies_when: []
  does_not_apply_when: []
  rationale: null
  cues: ["sizing a tight turned diameter on a part still warm from the cut"]
  actions: []
  common_mistake: "Setting the offset from a warm part."
  expert_confidence: not_stated
  topics: [t-tight-tol, t-mat-174ph, t-m-integrex]
  tags: [tight-tolerance, stainless, mill-turn]
  links: { jobs: [J-G045], machine: m-integrex }
  source:
    kind: manual
    text: >-
      The 17-4 pivot shafts in June. I sized the bearing diameters right at the machine with the parts still warm
      from the cut, and they measured good. Next morning Linda's room had them two tenths under on the tightest
      diameter. Nothing got scrapped, but we held every shaft until it was cold, measured it twice, and the job ran
      an hour over. Now on any turned diameter held to tenths, I let the part cool to room temperature before I
      touch the offset.
    note: Entered by Tomás after the pivot shaft job.
  approved: { by: PER-04, on: "2026-06-18", mode: self }
  created_on: "2026-06-15"
