  title: "RP-M06 part catcher misses short parts: run the mesh liner, check it at bar change"
  statement: >-
    Our L20, RP-M06, doesn't catch parts shorter than about a quarter inch overall; they drop into the chips and get
    dinged. Since 2021 we run a fine mesh liner in the chip pan under the catcher, and we always check the catcher
    at every bar change.
  applies_when: ["RP-M06 Swiss", "parts shorter than about a quarter inch overall"]
  does_not_apply_when: ["longer parts, which the catcher grabs fine"]
  rationale: null
  cues: ["short parts turning up dinged in the chip pan"]
  actions: ["run the fine mesh liner under the catcher for short parts", "check the part catcher at every bar change"]
  common_mistake: "Running short parts without the liner and finding them in the chips."
  expert_confidence: always
  topics: [t-m-swiss]
  tags: [swiss]
  links: { machine: m-swiss }
  source: { kind: interview, interview: INT-07 }
  evidence:
    - { turn: INT-07-T024, quote: "Our L20, RP-M06, has a quirk with the part catcher. Anything shorter than about a quarter inch, the catcher misses it, and it drops into the chips and gets dinged." }
    - { turn: INT-07-T024, quote: "Since 2021 we run a fine mesh liner in the chip pan under the catcher. We always check the catcher at every bar change.", confidence: true }
    - { turn: INT-07-T026, quote: "Overall length, yes. Longer than that, the catcher grabs them fine." }
  approved: { by: PER-04, on: "2026-07-21", mode: self }
