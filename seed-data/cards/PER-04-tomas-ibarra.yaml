# ---------------------------------------------------------------- INT-07: Swiss-turning small parts (internal)

- id: KC-047
  type: setup_tip
  status: approved
  title: "Swiss: mike every new bundle and set the guide bushing to the bar you have"
  statement: >-
    Mike the bar before you set the guide bushing, three places on a bar, every time you open a new bundle. Set the
    bushing to the bar you've got, not to the size on the tag. If the bar varies more than about two tenths end to
    end, it won't run right in the bushing, so buy ground bar for anything tight.
  applies_when: ["new bundle of bar on the Swiss", "part with a tight diameter"]
  does_not_apply_when: ["loose work where nothing is tighter than a couple of thou"]
  rationale: "The guide bushing holds the part right next to the tool; loose on the bar the part moves, too tight the bar galls and sticks."
  cues: ["chatter and a tight diameter wandering after a new bundle goes in", "offsets being chased shift after shift"]
  actions: ["mike the bar in three places on a couple of bars from each new bundle", "set the guide bushing to the measured bar", "buy ground bar for tight work"]
  common_mistake: "Trusting the size on the bar's tag and chasing size with offsets."
  thresholds:
    - { quantity: bar size variation end to end, comparator: ">", value: 0.0002, unit: in, verbatim: "more than about two tenths" }
  expert_confidence: always
  topics: [t-m-swiss, t-tight-tol]
  tags: [swiss, tight-tolerance]
  links: { machine: m-swiss }
  source: { kind: interview, interview: INT-07 }
  evidence:
    - { turn: INT-07-T016, quote: "Mike the bar before you set the guide bushing. Three places on a bar, a couple of bars from the bundle. I do it every time we open a new bundle.", confidence: true }
    - { turn: INT-07-T016, quote: "If the bar varies more than about two tenths from end to end, it's not going to run right in the bushing. That's why we buy ground bar for anything tight now." }
    - { turn: INT-07-T014, quote: "The bushing is what holds the part while you cut it. If the bushing is loose on the bar, the part moves. If it's too tight, the bar galls and sticks. You set the bushing to the bar you've got, not to the size on the tag." }
    - { turn: INT-07-T018, quote: "Loose work, where nothing on the part is tighter than a couple of thou." }
  approved: { by: PER-04, on: "2026-07-21", mode: self }
  created_on: "2026-07-16"

- id: KC-048
  type: setup_tip
  status: approved
  title: "316 on the Swiss: peck the drills and break the chip on the roughing passes"
  statement: >-
    On 316, always program a peck on the drills and a chip break on the roughing passes. 316 wants to make one long
    string; if you don't break it, it wraps the part and the tool and drags across the finished diameter.
  applies_when: ["316 on the Swiss"]
  does_not_apply_when: []
  rationale: "A continuous 316 chip wraps and marks the finished diameter."
  cues: ["long, stringy chips wrapping the part or the tool"]
  actions: ["program a peck on every drill", "program a chip break on the roughing passes"]
  common_mistake: "Letting a tool make a continuous chip on 316."
  expert_confidence: always
  topics: [t-m-swiss, t-mat-316]
  tags: [swiss, stainless]
  links: { machine: m-swiss, material: mat-316 }
  source: { kind: interview, interview: INT-07 }
  evidence:
    - { turn: INT-07-T020, quote: "316 wants to make one long string. If you don't break it, it wraps around the part and the tool, and it drags across the finished diameter." }
    - { turn: INT-07-T020, quote: "Always program a peck on the drills and a chip break on the roughing passes.", confidence: true }
    - { turn: INT-07-T012, quote: "With the parts chattering, the 316 chips got long and stringy and started wrapping. A couple of parts got marked up on the finished diameter." }
  approved: { by: PER-04, on: "2026-07-21", mode: self }
  created_on: "2026-07-16"

- id: KC-049
  type: setup_tip
  status: approved
  title: "PEEK on the Swiss: sharp tools, light pick-off grip, measure after ten minutes"
  statement: >-
    PEEK grows with heat: a part right out of the catcher measures big and is back on size ten minutes later. Keep
    the tools sharp so they cut instead of pushing a fuzzy burr, set the sub-spindle grip light on the pick-off,
    and usually let the parts sit ten minutes before you measure a diameter.
  applies_when: ["PEEK parts on the Swiss"]
  does_not_apply_when: ["final inspection on the CMM — that follows Linda's soak rule"]
  rationale: "A dull tool makes heat, and heat makes PEEK grow and burr."
  cues: ["a fuzzy burr instead of a clean edge", "a diameter measuring big right out of the catcher"]
  actions: ["keep the tools sharp", "set the sub-spindle grip light on the pick-off", "let parts sit ten minutes before measuring a diameter"]
  common_mistake: "Measuring a warm PEEK part and offsetting to it."
  expert_confidence: usually
  topics: [t-m-swiss, t-mat-peek]
  tags: [swiss, peek, deburr]
  links: { machine: m-swiss, material: mat-peek }
  source: { kind: interview, interview: INT-07 }
  evidence:
    - { turn: INT-07-T022, quote: "PEEK grows with heat. A sleeve right out of the catcher measures big, and ten minutes later it's back on size." }
    - { turn: INT-07-T022, quote: "Keep the tools sharp on PEEK. A dull tool makes heat and pushes a fuzzy burr instead of cutting." }
    - { turn: INT-07-T022, quote: "Usually I let the parts sit ten minutes before I measure a diameter.", confidence: true }
    - { turn: INT-07-T022, quote: "And on the pick-off, set the sub-spindle grip light, or it squeezes the sleeve out of round." }
  approved: { by: PER-04, on: "2026-07-21", mode: self }
  created_on: "2026-07-16"

- id: KC-050
