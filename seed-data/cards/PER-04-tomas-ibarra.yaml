  common_mistake: "Letting the program swing the head in from either side."
  expert_confidence: always
  topics: [t-m-integrex, t-cam]
  tags: [mill-turn, cam]
  links: { machine: m-integrex }
  source:
    kind: manual
    text: >-
      The milling head on RP-M05 has a little play when it swings through vertical. It's been like that since we got
      the machine in 2014. We always swing the B-axis to position from the same side and let the clamp lock before
