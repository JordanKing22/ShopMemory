- id: KC-006
  type: quoting_rule
  status: approved
  title: "New defense customer: quote the first lot as a pilot, paperwork on its own lines"
  statement: >-
    With a brand-new defense customer, usually quote the first lot as a pilot: price the first article, the source
    inspection and a paperwork allowance as their own lines, and tell them the second lot will come down.
  applies_when: ["new customer", "defense or space customer with a real quality department"]
  does_not_apply_when: ["repeat customer", "commercial customer with a simple PO"]
  rationale: "On a first lot every question goes back and forth twice."
  cues: []
  actions: ["quote the first lot as a pilot", "price first article, source inspection and paperwork as separate lines"]
  common_mistake: "Quoting the first lot at the repeat price."
  expert_confidence: usually
  topics: [t-cus-06, t-quoting]
  tags: [new-customer, defense, quoting, first-article]
  links: { quotes: [Q-A06], jobs: [J-A06], customer: CUS-06 }
  source: { kind: interview, interview: INT-02 }
  evidence:
    - { turn: INT-02-T018, quote: "With a brand-new defense customer I usually quote the first lot as a pilot. I price the first article, the source inspection and a paperwork allowance as their own lines, and I tell them the second lot will come down.", confidence: true }
    - { turn: INT-02-T016, quote: "New customer, and a defense or space customer with a real quality department. A commercial customer with a simple PO, not so much." }
