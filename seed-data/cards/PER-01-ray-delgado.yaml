- id: KC-001
  type: quoting_rule
  status: approved
  title: "Titanium brackets: quote finish time from wall height, not stock removed"
  statement: >-
    On titanium brackets with thin walls, quote the finishing time from the total wall height you have to walk
    down in light passes, not from the volume of stock removed. The software's removal-rate number usually comes in low.
  applies_when: ["titanium bracket", "thin walls"]
  does_not_apply_when: ["thick walls that don't need light finishing passes"]
  rationale: "The removal-rate number the software gives usually comes in low."
  cues: ["tall thin walls on the print"]
  actions: ["quote finishing from total wall height"]
  common_mistake: "Quoting finishing from the volume removed."
  expert_confidence: usually
  topics: [t-thin-wall, t-mat-ti64, t-quoting]
  tags: [thin-wall, titanium, quoting, finishing]
  links: { jobs: [J-A04], material: mat-ti64 }
  source:
    kind: seed_binder
    text: >-
      Titanium brackets with thin walls: I quote finish time off the total wall height I have to walk down in light
      passes, not off how much stock comes out. The removal-rate number the software gives usually comes in low.
    note: From Ray's quoting binder.
  approved: { by: PER-01, on: "2026-03-12", mode: self }
  created_on: "2026-03-09"

- id: KC-002
  type: setup_tip
  status: approved
  title: "Thin Ti walls on the DMU: fresh finisher, shortest stickout"
  statement: >-
    On the DMU 50, always run the finish pass on thin titanium walls with a fresh end mill and the shortest stickout
    the part allows. A worn finisher pushes the wall and you chase size all day.
  applies_when: ["thin titanium walls", "finish pass on the DMU 50"]
  does_not_apply_when: []
  rationale: "A worn finisher pushes the wall and you chase size all day."
  cues: ["wall size drifting part to part"]
  actions: ["use a fresh end mill for the finish pass", "use the shortest stickout the part allows"]
  common_mistake: "Running the finisher until it looks worn."
  expert_confidence: always
  topics: [t-thin-wall, t-mat-ti64, t-m-dmu50]
  tags: [thin-wall, titanium, finishing, tool-wear, dmu]
  links: { jobs: [J-A02], machine: m-dmu50 }
  source:
    kind: seed_binder
    text: >-
      DMU 50, thin titanium walls: always finish with a fresh end mill and the shortest stickout the part lets you
      get away with. A worn finisher pushes the wall and you chase size all day.
    note: From Ray's quoting binder (what he tells the 5-axis crew on titanium work).
  approved: { by: PER-01, on: "2025-12-15", mode: self }
  created_on: "2025-12-13"

