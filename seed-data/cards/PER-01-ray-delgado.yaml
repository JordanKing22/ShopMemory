- id: KC-010
  type: quoting_rule
  status: approved
  title: "Always get outside processing quotes in writing, with lead time, first"
  statement: >-
    Always get the outside processing quote in writing — price and lead time — before our quote goes out. A number
    over the phone isn't a quote, and the lead time is what bites.
  applies_when: ["any job with heat treat, passivation or other outside processing"]
  does_not_apply_when: []
  rationale: "When I skip that, the lead time is what bites."
  cues: ["a process callout on the print"]
  actions: ["get vendor price and lead time in writing before quoting", "add travel days both ways"]
  common_mistake: "Treating outside processing as a line item instead of a step in the job."
  expert_confidence: always
  topics: [t-outside-proc, t-quoting]
  tags: [outside-processing, quoting, lead-time]
  links: { jobs: [J-A08] }
  source: { kind: interview, interview: INT-01 }
  evidence:
    - { turn: INT-01-T020, quote: "Always get the outside processing quote in writing before ours goes out — price and lead time. A number over the phone from the heat treater isn't a quote. When I skip that, the lead time is what bites.", confidence: true }
    - { turn: INT-01-T024, quote: "Or they'd forget the travel days both ways. They treat outside processing like a line item instead of a step in the job." }
  approved: { by: PER-01, on: "2026-06-12", mode: self }
  created_on: "2026-06-10"

