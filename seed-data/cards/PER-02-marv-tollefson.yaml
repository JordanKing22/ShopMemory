  cues: ["edges on the back side of the lugs"]
  actions:
    - "put the edge breaks in the CAM program with a small chamfer mill"
    - "do the edge breaks before the part comes off the plate"
    - "hand deburr only what's left"
  common_mistake: "Deburring by hand after the part is off the machine and dinging the hinge bores."
  expert_confidence: always
  topics: [t-m-dmu50, t-cam]
  tags: [deburr, cam, dmu]
  links: { jobs: [J-A05], machine: m-dmu50 }
  source: { kind: interview, interview: INT-04 }
  evidence:
