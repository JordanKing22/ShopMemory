- id: KC-023
  type: machine_quirk
  status: approved
  title: "RP-M03 DMU 50: re-qualify the spindle probe after any bump or stylus change"
  statement: >-
    Since RP-M03's spindle service in 2024, always re-qualify the spindle probe on the ring gauge after any bump, even
    a light one, and after every stylus change. In 2025 a light tap on a clamp threw it about two thou off in X, and it
    looked fine.
  applies_when: ["RP-M03 spindle probe after a bump or a stylus change"]
  does_not_apply_when: []
  rationale: "A probe can look fine and still read off after a light tap."
  cues: ["a bore off location with no other explanation", "the probe touched something it shouldn't have"]
  actions: ["re-qualify the probe on the ring gauge before anything else runs"]
  common_mistake: "Trusting a probe that looks fine after a light tap."
  expert_confidence: always
  topics: [t-m-dmu50]
  tags: [probing, dmu]
  links: { machine: m-dmu50 }
  source:
    kind: manual
    text: >-
      RP-M03 — since the spindle service in 2024, re-qualify the spindle probe on the ring gauge after any bump, even a
      light one, and after every stylus change. Right after the service it read off until we re-qualified it. In 2025
      it took a light tap on a clamp, looked fine, and read about two thou off in X. We found out when a bore came out
      off location. Now it always gets re-qualified before anything else runs.
    note: Entered by Marv after the probe tap.
  classification: general
  approved: { by: PER-02, on: "2025-06-18", mode: self }
