- id: KC-014
  type: setup_tip
  status: approved
  title: "Probe the dovetail plate every time it goes back on the DMU, then probe the blank"
  statement: >-
    Every time the dovetail plate goes back on the DMU 50 table, probe the center bore for X and Y and the top face
    for Z before the first part, then probe the blank. Never trust the old work offset, even if the plate went back
    on the same dowels.
  applies_when: ["the dovetail plate goes back on the DMU 50"]
  does_not_apply_when: []
  rationale: "Once it's probed, the plate is the one thing I trust. Saw-cut blanks are never the same height."
  cues: ["the plate just went back on the table", "a new batch of saw-cut blanks"]
  actions: ["probe the center bore for X and Y", "probe the top face for Z", "probe each blank before cutting"]
  common_mistake: "Trusting the old work offset because the plate went back on the same dowels."
  expert_confidence: always
  topics: [t-5ax-workholding, t-m-dmu50]
  tags: [probing, workholding, dmu]
  links: { jobs: [J-I01], machine: m-dmu50 }
  source: { kind: interview, interview: INT-03 }
  evidence:
    - { turn: INT-03-T024, quote: "Every time the plate goes back on the table, I probe it.", confidence: true }
    - { turn: INT-03-T024, quote: "The bore in the middle and the top face, before the first part. I never trust the old work offset, even if the plate went back on the same dowels." }
    - { turn: INT-03-T026, quote: "The bore gives me X and Y, the top face gives me Z, and once it's probed the plate is the one thing I trust. Then I probe the blank too, because saw-cut blanks are never the same height." }
