- id: KC-022
  type: machine_quirk
  status: approved
  title: "RP-M03 DMU 50: on winter mornings, warm up B and C before compound-angle work"
  statement: >-
    RP-M03 sits closest to the dock door. On winter mornings, always run the axis warm-up program that swings B and C
    through full travel for twenty minutes, then probe the part, before any compound-angle work. Cold, the first part
    comes out a few tenths off location.
  applies_when: ["RP-M03 on a winter morning", "features cut at compound angles"]
  does_not_apply_when: []
  rationale: "It sits closest to the dock door, and on winter mornings the first part comes out off location until the machine warms up."
  cues: ["the first compound-angle part of the morning is off location"]
  actions: ["run the axis warm-up program for twenty minutes", "probe the part before the first cut"]
  common_mistake: "Cutting the first compound-angle part on a cold machine."
  expert_confidence: always
  topics: [t-m-dmu50, t-tight-tol]
  tags: [warm-up, dmu, probing]
  links: { machine: m-dmu50 }
  source:
    kind: manual
    text: >-
      RP-M03, our DMU 50, sits closest to the dock door. On winter mornings the first part cut at compound angles comes
      out a few tenths off location until the machine warms up. We always run the axis warm-up program first — it
      swings B and C through full travel for twenty minutes — and then I probe the part before the first cut.
    note: Entered by Marv after a cold week in January.
  classification: general
