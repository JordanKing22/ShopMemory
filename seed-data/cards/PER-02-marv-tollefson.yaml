- id: KC-027
  type: machine_quirk
  status: approved
  title: "RP-M07 wire EDM: set thick 17-4 up for our weak lower flush"
  statement: >-
    RP-M07's lower flushing has been weak since we bought it used in 2013. On 17-4 over two inches thick, set the
    flattest face down on the lower nozzle, bring the upper nozzle right down to the part, and run the first pass
    slower than the book. When it breaks wire on thick 17-4, it's usually the flushing, not the wire.
  applies_when: ["RP-M07 wire EDM", "17-4 over two inches thick"]
  does_not_apply_when: []
  rationale: "When it breaks wire on thick 17-4, it's usually the flushing, not the wire."
  cues: ["wire breaks on thick 17-4"]
  actions:
    - "set the flattest face down on the lower nozzle"
    - "bring the upper nozzle right down to the part"
    - "run the first pass slower than the book"
  common_mistake: "Blaming the wire and changing spools when it's the flushing."
  thresholds:
    - { quantity: 17-4 stock thickness, comparator: ">", value: 2, unit: in, verbatim: "over two inches thick" }
  expert_confidence: usually
  topics: [t-m-wedm, t-mat-174ph]
  tags: [wire-edm, stainless]
  links: { machine: m-wedm }
  source:
    kind: manual
    text: >-
      RP-M07, the wire EDM: the lower flushing has been weak since we bought it used in 2013. On 17-4 over two inches
      thick, set the part with its flattest face down on the lower nozzle, bring the upper nozzle right down to the
      part, and run the first pass slower than the book. When it breaks wire on thick 17-4, it's usually the flushing,
      not the wire.
    note: Entered by Marv for the EDM corner.
  classification: general
  approved: { by: PER-02, on: "2024-09-11", mode: self }
  created_on: "2024-09-09"

