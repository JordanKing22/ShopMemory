- id: KC-026
  type: setup_tip
  status: approved
  title: "Graymoor 4-port manifold: drill the cross ports before the deep pockets"
  statement: >-
    On the Graymoor 4-port manifold in 17-4, drill the cross ports before you open the deep pockets. With the pockets
    open first, the drill walks when it breaks through.
  applies_when: ["17-4 manifold with cross-drilled ports and deep pockets"]
  does_not_apply_when: []
  rationale: "An open pocket gives the drill nothing to break through into cleanly."
  cues: ["cross ports that break into a pocket"]
  actions: ["drill the cross ports before opening the deep pockets"]
  common_mistake: "Roughing all the pockets first because it's faster."
  expert_confidence: always
  topics: [t-mat-174ph, t-m-genos]
  tags: [deep-pocket, stainless, genos, defense]
  links: { jobs: [J-A10], machine: m-genos }
  source:
    kind: manual
    text: >-
      Graymoor 4-port manifold, 17-4: always drill the cross ports before you open the deep pockets. Open the pockets
      first and the drill walks when it breaks through.
    note: Entered by Marv after the manifold job.
  approved: { by: PER-02, on: "2026-05-12", mode: self }
