  title: "Dovetail plate: lowest feature you cut at least 3/4 inch above the jaws"
  statement: >-
    On the DMU 50 dovetail plate, leave the blank tall enough that the lowest feature you cut sits at least 3/4 inch
    above the top of the jaws. That's what our holders need to clear the jaws at the steepest tilt we run.
  applies_when: ["part held in the dovetail plate on the DMU 50", "features that need a steep tilt"]
  does_not_apply_when: ["every feature is on top and nothing needs a steep tilt", "a tall part — make a fixture instead"]
  rationale: "Less than that and you're betting on the sim. A lot more than that and the part starts to sing on the finish passes."
  cues: ["low features that need a steep tilt"]
  actions:
    - "measure from the top of the jaws to the lowest feature you cut, not to the bottom of the blank"
    - "order the blank taller to suit"
  common_mistake: "Measuring the clearance to the bottom of the blank instead of the lowest feature."
  thresholds:
