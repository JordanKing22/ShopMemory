- id: KC-017
  type: setup_tip
  status: approved
  title: "Anodized 7075, unmasked tight bores: finish high by what the coat takes off"
  statement: >-
    On 7075 where dimensions apply after anodize and the bores aren't masked, finish tight bores on the high side:
    aim for the low limit plus what the coat takes off the diameter, plus a tenth. On the hinge bracket our
    anodizer's coat closed a bore up about four tenths on the diameter.
  applies_when: ["7075 part where dimensions apply after anodize", "tight bore with no masking note"]
  does_not_apply_when: ["bores masked for anodize — finish to print", "a different finish, like chem film — ask again"]
  rationale: "In a bore it grows in from all the way around, so the diameter loses twice what the coat grows on one side."
  cues: ["a finish note that says after anodize or after finish", "no masking note on the bores"]
  actions:
    - "get the growth number from the anodizer for that callout"
    - "aim for the low limit plus what the coat takes off the diameter, plus a tenth"
    - "set it before the first piece"
  common_mistake: "Cutting to the model's nominal size instead of reading the print notes."
  thresholds:
    - { quantity: bore diameter lost to this anodize coat, comparator: approx, value: 0.0004, unit: in, verbatim: "about four tenths on the diameter" }
  expert_confidence: always
  topics: [t-mat-7075, t-tight-tol, t-m-dmu50]
  tags: [aluminum, outside-processing, tight-tolerance, dmu]
  links: { jobs: [J-A05], machine: m-dmu50 }
  source: { kind: interview, interview: INT-04 }
  evidence:
    - { turn: INT-04-T010, quote: "The print says dimensions apply after anodize, and the hinge bores aren't masked. Our anodizer's number for this coat is about two tenths a side, so a bore closes up about four tenths on the diameter." }
    - { turn: INT-04-T020, quote: "If there's no masking note and the bore is tight, I always finish it on the high side. I aim for the low limit plus what the coat takes off the diameter, plus a tenth.", confidence: true }
    - { turn: INT-04-T018, quote: "From our anodizer, for this callout on 7075. It's their number, not mine." }
    - { turn: INT-04-T022, quote: "If the bores are masked, finish to print. And if the finish is something else, like chem film, you ask again." }
    - { turn: INT-04-T014, quote: "In a bore it grows in from all the way around, so the diameter loses twice what the coat grows on one side." }
  approved: { by: PER-02, on: "2026-08-17", mode: self }
  created_on: "2026-08-13"

