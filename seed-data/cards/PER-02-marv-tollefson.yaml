- id: KC-029
  type: customer_quirk
  status: approved
  title: "Quantrel: no rework without their written OK, not even a re-cut"
  statement: >-
    Quantrel doesn't allow rework without their written OK — not even re-cutting a missed chamfer or a floor left a
    thou shallow. Stop, tag the part, and have Linda ask them first. A reworked part they didn't approve is a reject,
    even if it measures good.
  applies_when: ["any Quantrel part that's off"]
  does_not_apply_when: []
  rationale: "Our habit is to put the part back in and fix it; with Quantrel that turns a fixable part into a reject."
  cues: ["a Quantrel part that missed a feature or a size"]
  actions: ["stop and tag the part", "have Linda get Quantrel's written OK before any rework"]
  common_mistake: "Putting the part back in and fixing it, like we would for anyone else."
